# Credda on this repository's issues.
#
# Two jobs on one trigger block:
#
#   triage       fires when an issue is OPENED. Runs no repository code, starts
#                no container, makes no model call. It reads the report and
#                either names something specific the reporter could add, or says
#                nothing at all. Silence is a correct outcome.
#
#   investigate  fires when the `credda` label is ADDED. Checks the repository
#                out, reproduces the reported failure in a sandbox, and comments
#                what it established -- leading with what it did not.
#
# STATUS, 2026-08-29: the reporting stages run today; the fix stage runs when a
# model-backed provider is configured. This block said, until today, that pull
# request authoring was not yet wired up. It is: the delivery path was wired on
# 2026-08-28 and the action grows an `open-pull-request` input -- on the
# action's unmerged branch, not at the `@v1` this workflow pins and not on its
# default branch, so no version reachable from here accepts that input at all.
# Either way the behaviour below is unchanged: it comments and pushes no
# branch. The reason is now "we did not opt in" rather than "the feature does
# not exist", which is the difference that matters when you are deciding what
# to grant.
#
# `contents: read`, `issues: write` and `id-token: write` is the whole
# permission set this needs. The third mints the OIDC token the action's
# launcher presents to fetch the engine; it grants no access to anything of
# this repository's. Turning delivery on would mean granting `contents: write`
# and `pull-requests: write` here deliberately. If a later version of the
# action asks for more than that on its own, read the diff before granting it
# -- a workflow that can write to `contents` can write to `main`.
#
# BEFORE YOU RUN THIS, create the label once:
#
#     gh label create credda \
#       --description 'Credda reproduces this bug in a sandbox and comments what it established.'
#
# ACTION REFERENCE, as of 2026-08-27: the two `uses:` lines below say
# `Credda-io/action@v1`, and that resolves -- the repository is public and the
# `v1` tag exists.
#
# They previously said `codereefai/codereef-action@v1`, which never resolved:
# the owner has since become `Credda-io`, but the repository name was also
# wrong. The action lives in a repository called `action`. Correcting the
# owner alone would have left this workflow just as broken as before.
#
# `@v1` is a moving tag and there is no published Release behind it. Pin a
# commit SHA if this workflow needs to keep meaning one thing over time.
name: Credda

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read # checkout of the repository under test
  issues: write # the one report comment
  id-token: write # mint the OIDC token the action's launcher fetches the engine with

jobs:
  triage:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Keyed on the issue so a triage note and an investigation report cannot
      # race to comment on the same thread.
      group: credda-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Optional in triage mode. With it, a refusal can say "this repository
      # holds no src/pricing.ts" instead of staying quiet.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Credda-io/action@v1
        with:
          mode: triage
          # Passed explicitly, not left to the default. At `@v1` the action's
          # `label` default is `codereef`, so without this line triage would
          # stay quiet for the wrong name -- and an issue opened already
          # carrying `credda` would get a triage note on top of the
          # investigation that is about to run on it.
          label: credda

  investigate:
    if: github.event.action == 'labeled' && github.event.label.name == 'credda'
    runs-on: ubuntu-latest # the docker sandbox needs a Linux runner
    timeout-minutes: 30
    concurrency:
      group: credda-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Credda-io/action@v1
        with:
          # Passed explicitly, not left to the default, and this is the whole
          # reason the line exists. The action re-checks the applied label
          # against this input as defence in depth. At `@v1` the default is
          # `codereef`, so a job triggered by the `credda` label above would
          # enter the action, fail that re-check, and EXIT 0 -- a green job
          # that did nothing, with no red anywhere to notice it by. The
          # default only became `credda,codereef` after the tag was cut.
          label: credda
          # Optional. Without a key the deterministic heuristic provider runs:
          # it reproduces and reports, and cannot reason over prose. Several of
          # the seeded reports in issues/ are prose-heavy, so a key makes the
          # difference visible.
          #
          # THIS MUST NOT BE THE PRODUCTION KEY. It was `secrets.ANTHROPIC_API_KEY`
          # until 2026-08-31 -- the same key credda-backend serves customer traffic
          # on. This repository is PUBLIC and this job feeds the model an issue body
          # that anyone on the internet can author, so a successful prompt injection
          # here reaches whatever that key can reach. The job is gated on a
          # maintainer applying the `credda` label, which controls who can start it
          # but not who can write what it reads.
          #
          # Use a dedicated key, scoped and given a low spend cap, so the blast
          # radius of this workflow is this workflow. If the secret is unset the
          # deterministic provider runs, which is a degraded report and not an
          # outage -- the safe direction to fail.
          anthropic-api-key: ${{ secrets.TOOLSHED_ANTHROPIC_API_KEY }}
