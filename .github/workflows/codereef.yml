# CodeReef on this repository's issues.
#
# Two jobs on one trigger block:
#
#   triage       fires when an issue is OPENED. Runs no repository code, starts
#                no container, makes no model call. It reads the report and
#                either names something specific the reporter could add, or says
#                nothing at all. Silence is a correct outcome.
#
#   investigate  fires when the `codereef` label is ADDED. Checks the repository
#                out, reproduces the reported failure in a sandbox, and comments
#                what it established -- leading with what it did not.
#
# CodeReef writes no code and opens no pull request. `contents: read` and
# `issues: write` is the whole permission set; if you fork this and it asks for
# more, that is the fork's decision.
#
# BEFORE YOU RUN THIS, create the label once:
#
#     gh label create codereef \
#       --description 'CodeReef reproduces this bug in a sandbox and comments what it established.'
#
# ACTION REFERENCE: `codereefai/codereef-action@v1` below is the intended public
# location and DOES NOT EXIST YET. Until that repository is published this
# workflow will fail to resolve the action. Update the two `uses:` lines when it
# does, and pin a tag or a commit SHA rather than a branch.
name: CodeReef

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read # checkout of the repository under test
  issues: write # the one report comment

jobs:
  triage:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Keyed on the issue so a triage note and an investigation report cannot
      # race to comment on the same thread.
      group: codereef-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Optional in triage mode. With it, a refusal can say "this repository
      # holds no src/pricing.ts" instead of staying quiet.
      - uses: actions/checkout@v4
      - uses: codereefai/codereef-action@v1
        with:
          mode: triage

  investigate:
    if: github.event.action == 'labeled' && github.event.label.name == 'codereef'
    runs-on: ubuntu-latest # the docker sandbox needs a Linux runner
    timeout-minutes: 30
    concurrency:
      group: codereef-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: codereefai/codereef-action@v1
        with:
          # Optional. Without a key the deterministic heuristic provider runs:
          # it reproduces and reports, and cannot reason over prose. Several of
          # the seeded reports in issues/ are prose-heavy, so a key makes the
          # difference visible.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
