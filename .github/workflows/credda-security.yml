name: Credda security

# Runs Credda's security mode on this repository: exploit probes and a fuzz
# stage, each in a container with no network. Only a proven finding is reported.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/credda-security.yml'

permissions:
  contents: read # checkout of the repository under test
  id-token: write # the OIDC token the action's launcher fetches the engine with
  security-events: write # upload proven findings as SARIF to code scanning

concurrency:
  group: credda-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest # the docker sandbox needs a Linux runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to the engine v0.1.19 release commit of Credda-io/action until v1 moves to it.
      - uses: Credda-io/action@f61935c9095ec0d2f6b2311a806f51a36369d93d
        id: credda
        with:
          mode: security
          extra-probes: xss
      # The reflected XSS in renderSearchPage is seeded (SEEDED.md, case 16). A run that misses it is a regression.
      - name: Read the count and the reach
        env:
          FOUND: ${{ steps.credda.outputs.security-findings }}
          REACH: ${{ steps.credda.outputs.security-reach }}
        run: |
          echo "proven findings: $FOUND"
          echo "reach: $REACH"
          if [ "${FOUND:-0}" -lt 1 ]; then echo "::error::the seeded XSS was not proven"; exit 1; fi

  # Known cases, so a release is read against something with a known answer.
  # Each is a public advisory that is already fixed upstream. Nothing here is
  # uploaded to this repository's code scanning.
  known:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flat 5.0.0 (prototype pollution, fixed in 5.0.1)
            repository: hughsk/flat
            ref: 38239cce29330b715d3e31aa96115641bfcc22bd # 5.0.0
            expect: found
          - name: flat 5.0.2 (fixed)
            repository: hughsk/flat
            ref: e5ffd664df8a1fcc05adc22dd0ac6a2b32a0955d # 5.0.2
            expect: clean
          - name: gdown before the fix (GHSA-76hw-p97h-883f, archive traversal)
            repository: wkentaro/gdown
            ref: 7f4cb689c5e4e31a55fd007fc400c50975f42799
            expect: found
          - name: gdown at the fix
            repository: wkentaro/gdown
            ref: af569fc6ed300b7974dee66dc51e9f01b57b4dff
            expect: any
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: Credda-io/action@f61935c9095ec0d2f6b2311a806f51a36369d93d
        id: credda
        with:
          mode: security
          upload-sarif: 'false'
      - name: Read the count against the known answer
        env:
          FOUND: ${{ steps.credda.outputs.security-findings }}
          EXPECT: ${{ matrix.expect }}
        run: |
          echo "proven findings: $FOUND (expected: $EXPECT)"
          if [ "$EXPECT" = "found" ] && [ "${FOUND:-0}" -lt 1 ]; then echo "::error::a known vulnerable version read clean"; exit 1; fi
          if [ "$EXPECT" = "clean" ] && [ "${FOUND:-0}" -ne 0 ]; then echo "::error::a fixed version produced a finding"; exit 1; fi
