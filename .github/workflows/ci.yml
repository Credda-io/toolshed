# The repository's own CI. It runs the GREEN suite (test/) and the typechecker,
# and it is green.
#
# It deliberately does NOT run `npm run repro` as a normal step. That directory
# holds the seeded failures and is red on purpose; wiring it in as a step would
# make a permanently red badge that nobody reads. `npm run repro` is a thing you
# run by hand when you want to see the defects. The second job below inverts it
# instead, per reproduction, so that a seeded defect quietly going green is
# still caught -- see `scripts/check-repro-red.mjs`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # SEEDED.md is the answer key a tool is judged against. This fails if a
      # report was added, renamed or removed without it, or if the counts it
      # publishes stopped matching the directories.
      - run: npm run check:seeded

  # Proof that the seeded defects are still seeded, one reproduction at a time.
  #
  # This job used to run `npm run repro` and require a non-zero exit. A non-zero
  # exit only means at least one of the fourteen reproductions failed, so a
  # single defect could be fixed and the job would still pass on the other
  # thirteen -- which is the demo quietly lying about what it holds, the exact
  # thing the job exists to prevent. `check:repro-red` reads the per-file
  # results and requires every reproduction to be red, none skipped, and none
  # missing from the run.
  seeded-bugs-still-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: every reproduction in repro/ must be red
        run: npm run check:repro-red
      - name: negative/ must be green
        run: npm run negative
